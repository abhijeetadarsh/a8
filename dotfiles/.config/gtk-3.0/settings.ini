[Settings]
# Adwaita-dark does the widget drawing. The generated gtk.css sitting next to
# this file then overrides Adwaita's palette with the wallpaper's, so Thunar
# and pavucontrol match the rest of the desktop instead of staying stock blue.
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Fantasque Sans Mono 11
gtk-enable-animations=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintfull
gtk-xft-rgba=rgb
