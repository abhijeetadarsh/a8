[module/launcher]
type = custom/text
format = 

; "content" has the same properties as "format-NAME"
format-background = ${color.shade1}
format-foreground = ${color.foreground}
format-padding = 2

; "click-(left|middle|right)" will be executed using "/usr/bin/env sh -c $COMMAND"
click-left = ~/.config/polybar/shades/scripts/launcher.sh &
;;click-middle = ~/.config/polybar/shades/scripts/launcher-full
click-right = ~/.config/i3/script/theme_init.sh --my_collection &

; "scroll-(up|down)" will be executed using "/usr/bin/env sh -c $COMMAND"
;;scroll-up = ~/.config/polybar/shades/scripts/launcher.sh &
;;scroll-down = ~/.config/i3/script/theme_init.sh --my_collection &

