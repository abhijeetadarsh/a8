[module/sysmenu]
type = custom/text
format = 

format-background = ${color.shade2}
format-foreground = ${color.foreground}
format-padding = 2

click-left = ~/.config/polybar/shades/scripts/powermenu.sh &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Reshuffles the wallpaper, which re-themes the whole desktop. Replaces the
;; old colour-switcher, which sed-edited a static palette file that nothing
;; includes any more.
[module/wallpaper]
type = custom/text
format = 

format-background = ${color.background}
format-foreground = ${color.accent}
format-padding = 2

click-left = ~/.config/i3/script/theme_init.sh --my_collection &
click-right = ~/.config/i3/script/theme_init.sh --bing &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

