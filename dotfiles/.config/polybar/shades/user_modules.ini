[module/tray]
; Where nm-applet and blueman-applet put their icons. They were both already
; running with nothing to dock into, so bluetooth had no interface at all and
; NetworkManager's VPN and enterprise-wifi prompts had nowhere to appear.
;
; Only ever on one bar - see modules-right in config.ini.
type = internal/tray

format-background = ${color.background}
; Icons come in whatever size their app feels like; without a cap a single one
; can be taller than the bar.
tray-size = 66%
tray-spacing = 6px
tray-padding = 4px

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

[module/updates]
type = custom/script

; Available tokens:
;   %counter%
; Command to be executed (using "/usr/bin/env sh -c [command]")
exec = ~/.config/polybar/shades/scripts/updates.sh

; Conditional command that, if defined, needs to exit successfully
; before the main exec command is invoked.
; Default: ""
;;exec-if = ""

; Will the script output continous content?
; Default: false
tail = true

; Seconds to sleep between updates
; Default: 2 (0 if `tail = true`)
interval = 5

; Available tags:
;   <output> - deprecated
;   <label> (default)
format = <label>
format-prefix = 
format-background = ${color.shade7}
format-padding = 2

; Available tokens:
;   %output%
; Default: %output%
label = %output%

; Available tokens:
;   %counter%
;   %pid%
;
; "click-(left|middle|right)" will be executed using "/usr/bin/env sh -c [command]"
click-left = exo-open --launch TerminalEmulator &
click-right = exo-open --launch TerminalEmulator &
;;double-click-left = echo double left %counter%
;;double-click-middle = echo double middle %counter%
;;double-click-right = echo double right %counter%

; Available tokens:
;   %counter%
;   %pid%
;
; "scroll-(up|down)" will be executed using "/usr/bin/env sh -c [command]"
;;scroll-up = echo scroll up %counter%
;;scroll-down = echo scroll down %counter%


;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; The square to the left of the workspaces: show the desktop, on every
;; monitor, like Win+D. Click it again to put everything back.
;;
;; A module rather than the workspace button it switches to, because i3 deletes
;; an empty workspace as soon as you look away from it - the button would exist
;; only while you were already looking at the desktop. This is drawn by the bar,
;; so it is always there, and it lights up like a workspace button when the
;; desktop is what you are on. The workspace itself is mapped to an empty icon
;; in modules.ini so it never appears twice.
;;
;; tail = true: the script prints a line, redraws on i3's own workspace events,
;; and never exits - so the square changes state in the same frame as the
;; switch rather than up to an interval later.
[module/desktop]
type = custom/script
exec = ~/.config/i3/script/desktop.sh watch
tail = true

; <label>, not <output>: a custom/script has no <output> tag, and naming one
; polybar does not know disables the whole module - with -q, silently.
format = <label>
format-background = ${color.shade2}
label = %output%

click-left = ~/.config/i3/script/desktop.sh toggle &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; The camera button: opens guvcview on the webcam, where the exposure,
;; white balance, resolution and frame rate live, next to a live preview.
;;
;; A script module rather than a custom/text one purely for exec-if. This
;; config is meant to come up the same on any machine it is installed on, and
;; a machine with no webcam should not get a button that opens an app to tell
;; it there is no webcam. `camera.sh present` answers that, and polybar drops
;; the whole module - icon, padding and background - while it exits non-zero.
;;
;; So `exec` here only ever prints the glyph. Everything that has to know what
;; a camera is lives in camera.sh, which is also where the reason for that is
;; written down: /dev/video0 is not the camera, and on this laptop it is one
;; of four nodes belonging to two of them.
;;
;; interval, not tail: a USB webcam is plugged in by hand, which is not a
;; moment that needs the bar to react inside one frame. 15s is the delay
;; between plugging one in and the icon arriving.
[module/camera]
type = custom/script
exec = echo ""
exec-if = ~/.config/i3/script/camera.sh present
interval = 15

format = <label>
label = %output%
; shade4, stepping up through mic's shade5 into alsa's shade6 - see the note
; on [module/mic] for why these three are not all one colour.
label-background = ${color.shade4}
label-foreground = ${color.foreground}
label-padding = 2

; Both buttons, because there is nothing else for this one to do - a camera
; has no mute to put on the other click, and a button that ignores half the
; clicks aimed at it reads as broken.
click-left = ~/.config/i3/script/camera.sh settings &
click-right = ~/.config/i3/script/camera.sh settings &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; The microphone: whether it is live, and the way into the input settings.
;;
;; Worth its own module because the desktop had no way of answering "is my
;; mic hot" at all. XF86AudioMicMute toggles it and notify.sh says so for a
;; second and a half, after which the state is invisible again - and the alsa
;; module beside this one is the *speakers*, so a bar that looked fine said
;; nothing about the microphone either way.
;;
;; tail = true: volume.sh micwatch follows pactl's event stream and prints on
;; every change, so the glyph turns over in the same frame as the keypress.
;; An interval here would mean up to a second of a bar claiming the microphone
;; is on after it has been muted, which is the one direction that matters.
[module/mic]
type = custom/script
exec = ~/.config/i3/script/volume.sh micwatch
tail = true

format = <label>
label = %output%
; A shade of its own, and the reason all three of these are graded rather than
; painted one colour: camera, mic and alsa are three separate click targets
; sitting flush against each other, and on one background they read as a
; single block. There is no separator between polybar modules - the bar sets
; `separator =` empty - so the only thing marking the boundary is the colour,
; and without it a right click aimed at the speaker lands in the microphone's
; padding and opens the wrong tab.
;
; shade4 -> shade5 -> shade6 continues the ramp the right-hand side already
; had (alsa 6, battery 5, date 3, sysmenu 2), so it darkens away from the
; volume readout in both directions. Upwards was not an option: shade7 and
; shade8 are the bright end of the generated palette and the near-white
; foreground stops being readable on them.
label-background = ${color.shade5}
label-foreground = ${color.foreground}
label-padding = 2

; Left mutes, right configures - the same split as the alsa module, whose
; left click polybar reserves for its own mute toggle.
click-left = ~/.config/i3/script/volume.sh micmute &
click-right = ~/.config/i3/script/volume.sh micsettings &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Brightness of the screen this bar is drawn on. Scroll it.
;;
;; The per-screen part is the whole feature, and it is what the old
;; [module/brightness] - now [module/brightness_bar] in bars.ini, and never
;; wired into a bar - could not do. That one was internal/xbacklight pointed at
;; a fixed card, so it drove the laptop panel from whichever bar you happened to
;; scroll, and the external monitor not at all: an external has no
;; /sys/class/backlight entry, and its backlight is only reachable over DDC/CI.
;;
;; $MONITOR is what makes this work. launch.sh starts one polybar per output
;; with it set, so each bar's copy of this module resolves to its own screen and
;; the scroll lands where the pointer is.
;;
;; Note what is NOT written below: the output is never passed as an argument.
;; polybar 3.7 does not expand ${env:...} inside a module's exec, exec-if or
;; scroll values. It does expand it in bar keys - `monitor = ${env:MONITOR:}` in
;; config.ini works - which makes the failure a quiet one: the bars land on the
;; right screens while `exec = ... watch ${env:MONITOR:}` runs with the argument
;; silently dropped, and every bar drives the primary panel. This is the same
;; class of gap the [bar/main-tray] comment in config.ini describes for module
;; lists.
;;
;; brightness.sh reads $MONITOR out of its own environment instead. It is a
;; child of the polybar launch.sh started with MONITOR set, so the value is
;; already there, with no substitution to go wrong. An explicit output argument
;; still works when calling the script by hand.
;;
;; tail = true and no interval: the readout is pushed from brightness.sh over a
;; fifo the instant a level changes. An interval would be worse in both
;; directions here - laggy on screen, and on a DDC monitor it would mean a
;; 400ms i2c read every tick, forever, to re-learn a number we already know.
;;
;; exec-if hides the module on any output that cannot be dimmed at all - a
;; projector with DDC/CI switched off in its OSD, say - rather than leaving a
;; dead control sitting in the bar.
[module/brightness]
type = custom/script
exec = ~/.config/i3/script/brightness.sh watch
exec-if = ~/.config/i3/script/brightness.sh supported
tail = true

format = <label>
label = %output%
; shade3, one step below camera's shade4, continuing the 3-4-5-6 ramp that runs
; from here through camera and mic into alsa. Same reason [module/mic] gives:
; these sit flush against each other with no separator between them, so the
; colour step is the only thing telling you where one scroll target ends and
; the next begins.
label-background = ${color.shade3}
label-foreground = ${color.foreground}
label-padding = 2

; Middle click blanks this screen's backlight and remembers the level; middle
; click again brings it back. Middle rather than left, because left and right
; are where a mis-aimed click from the camera module next door lands, and this
; is the one action on the bar whose accidental firing you cannot see to undo.
;
; On the external monitor that is straightforwardly useful. On the laptop panel
; be aware the screen goes black, this module goes with it, and the way back is
; a second middle click on the same spot you cannot now see - or
; `brightness.sh on eDP-1` from a terminal. It works; it is just blind.
;
; Left and right are deliberately unbound. There is no third brightness action
; worth a button, and unlike the mic - where a dead click next to a live one
; reads as broken - here every button that does anything does the same thing.
scroll-up = ~/.config/i3/script/brightness.sh up &
scroll-down = ~/.config/i3/script/brightness.sh down &
click-middle = ~/.config/i3/script/brightness.sh toggle &

;; _-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_-_

;; Live up/down speed for the link actually carrying traffic.
;;
;; One module, not one per interface type. [module/wired-network] and
;; [module/wireless-network] in modules.ini were a pair on the reasoning that a
;; laptop is on a dongle or on wifi but never both - and a tethered phone plus
;; associated wifi is exactly both, so both rendered and the bar showed two
;; speed meters, one of them reading zero. internal/network cannot fix it: it
;; selects by interface type and neither module can know the other exists, let
;; alone which one owns the default route.
;;
;; netspeed.sh follows the route instead, so two links up is not a special case
;; - it is a routing table with a winner. Unplug the tether and it follows wifi
;; on the next tick, no restart.
;;
;; tail = true with the script's own one-second loop rather than interval=1:
;; a rate is a difference between two samples, so the reader has to hold the
;; previous one. polybar re-execing the script every second would hand it a
;; fresh process with nothing to subtract from.
[module/netspeed]
type = custom/script
exec = ~/.config/i3/script/netspeed.sh watch
tail = true

format = <label>
label = %output%
; shade4, the shade the two network modules had, so the right-hand side keeps
; the gradient it already had either side of this.
label-background = ${color.shade4}
label-foreground = ${color.foreground}
label-padding = 2

