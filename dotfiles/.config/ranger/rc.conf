# ranger - $mod+n, or `ranger` in any terminal.
#
# Theming note: ranger draws with the terminal's 16 ANSI colours, not with hex
# values. Since theme_engine regenerates kitty's 16 colours from the wallpaper,
# a colourscheme built only out of ANSI slots follows the desktop palette for
# free - see colorschemes/wallpaper.py.

set colorscheme wallpaper

# --- image previews ---------------------------------------------------------
# kitty draws images through its own graphics protocol, so previews work with
# no ueberzug/w3m helper process. Needs python-pillow.
set preview_images true
set preview_images_method kitty

set preview_files true
set preview_directories true
set collapse_preview true
set use_preview_script true
set preview_script ~/.config/ranger/scope.sh

# --- interface --------------------------------------------------------------
set viewmode miller
set column_ratios 1,3,4
set draw_borders both
set draw_progress_bar_in_status_bar true
set display_size_in_main_column true
set display_size_in_status_bar true
set display_free_space_in_status_bar true
set update_title true
set update_tmux_title false
set shorten_title 3
set tilde_in_titlebar true
set hostname_in_titlebar false

set show_hidden false
set show_hidden_bookmarks false
set line_numbers relative
set relative_current_zero false
set mouse_enabled true
set autosave_bookmarks true
set save_console_history true
set scroll_offset 8
set confirm_on_delete multiple
set wrap_scroll false
set padding_right true

set vcs_aware true
set vcs_backend_git enabled

# --- keys -------------------------------------------------------------------
map DD shell mv -t ~/.local/share/Trash/files %s
map <C-f> fzf_select
map <C-g> shell git status | less

# Open the current directory in a new terminal.
map <C-t> shell -f kitty --directory %d

# Set the current image as the wallpaper and re-theme the desktop from it.
map bg shell ~/.config/i3/script/theme_init.sh --file %f
