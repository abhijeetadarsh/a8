# tmux 3.x. Plugins live beside this file in ~/.config/tmux/plugins/ - tpm
# clones them there, and postinstall.sh does the same on a fresh machine.
# Inside tmux: prefix+I installs, prefix+U updates. Keys: prefix is C-Space,
# hjkl move between panes, HJKL resize.

set -g default-terminal "tmux-256color"
set -as terminal-features ',*:UTF-8'

set -g repeat-time 800

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1

set -s escape-time 100

# Copy mode with vim's visual keys: v / V / C-v select, y yanks. The yank
# lands in the system clipboard too - tmux forwards it to kitty over OSC 52
# (set-clipboard is "external" by default), so no xclip hook is needed.
setw -g mode-keys vi

bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi _   send-keys -X back-to-indentation

# --- colours ---------------------------------------------------------------
# Every colour below is a #{@thm_*} option, never a literal. theme_engine
# writes the real values to ~/.cache/theme/tmux.conf from the wallpaper, and
# since tmux expands formats inside style options, re-sourcing that one file
# recolours a running server in place - theme_init.sh does so on every
# wallpaper change. These are the stand-ins until the first wallpaper.
set -g @thm_accent    blue
set -g @thm_base      black
set -g @thm_surface0  brightblack
set -g @thm_surface1  brightblack
set -g @thm_text      white
set -g @thm_muted     white
set -g @thm_selection blue
set -g @thm_warning   yellow

source-file -q ~/.cache/theme/tmux.conf

# --- status line -----------------------------------------------------------
# The same shape as neovim's lualine, whose "auto" theme reads the same
# wallpaper colourscheme: an accent block (a) at each end, a base-coloured
# block (b) inside it, the bar itself in the StatusLine colour (c), joined
# by powerline arrows.
#
#   [ session ] windows ...                        [ host ][ HH:MM ]
#        a           c                                 b       a
set -g status-position bottom
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60
set -g status-style "fg=#{@thm_text},bg=#{@thm_surface0}"

# A themed pane fills every row right up to the status line, so a shell
# prompt on the last row and the bar below it read as one merged block with
# no edge between them. status-format[] gives the bar two rows instead of
# one: [0] is the row that sits directly against the pane - left blank and
# filled with @thm_base (the terminal's own background, not the bar's
# surface0), so it reads as empty terminal rather than a second bar - and
# [1] is the bar's real content, pushed down onto the row that was already
# the terminal's bottom edge. [1] is tmux's own default composition
# (`tmux show -g status-format[0]`, before this change), copied rather than
# hand-written, so window clicking and every other mouse range it wires up
# keeps working exactly as before - only which row it renders on changes.
#
# [0] has to use fill=, not bg=. An empty format draws no characters, and
# bg= only recolours characters a format actually draws - the padding tmux
# uses to fill the rest of an underfilled row always falls back to
# status-style's background (surface0) regardless. fill= is the attribute
# that exists specifically to recolour that padding.
set -g status 2
set -g status-format[0] "#[fill=#{@thm_base}]"
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

set -g status-left  "#[fg=#{@thm_base},bg=#{@thm_accent},bold] #S #[fg=#{@thm_accent},bg=#{@thm_surface0},nobold] "
set -g status-right "#[fg=#{@thm_base}]#[fg=#{@thm_accent},bg=#{@thm_base}] #h #[fg=#{@thm_accent}]#[fg=#{@thm_base},bg=#{@thm_accent},bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#{@thm_muted}] #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-current-format "#[fg=#{@thm_accent},bold] #I #W#{?window_zoomed_flag, Z,} "
setw -g window-status-bell-style     "fg=#{@thm_warning},bold"
setw -g window-status-activity-style "fg=#{@thm_warning}"

set -g pane-border-style        "fg=#{@thm_surface1}"
set -g pane-active-border-style "fg=#{@thm_accent}"
set -g message-style            "fg=#{@thm_text},bg=#{@thm_surface0}"
set -g message-command-style    "fg=#{@thm_text},bg=#{@thm_surface0}"
set -g mode-style               "fg=#{@thm_text},bg=#{@thm_selection}"

# --- plugins ---------------------------------------------------------------
# tpm's default plugin dir depends on where it finds the config; say it
# outright so this file and postinstall.sh agree on the path.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"

run "~/.config/tmux/plugins/tpm/tpm"
