# mpv.
#
# Short on purpose - this only sets what stops video from tearing on this
# desktop. Everything else is mpv's default.

# --- tearing ----------------------------------------------------------------
# picom is the only thing syncing frames here (see ../picom/picom.conf), and
# it can only sync what it composites. Two ways video escapes that:
#
#   - a legacy video output that scans out on its own path. vo=gpu goes
#     through GL like every other window, so picom's vblank timing applies.
#   - mpv asking the compositor to get out of the way. That is what
#     x11-bypass-compositor does, and "no" keeps picom in the loop even
#     fullscreen.
vo=gpu
x11-bypass-compositor=no

# Resample audio to fit the display's actual refresh rate rather than dropping
# or repeating a frame every few seconds. This is what removes the periodic
# judder that survives vsync; it costs a little CPU and nothing else.
video-sync=display-resample

# --- hardware decoding ------------------------------------------------------
# The GPU decodes video instead of the CPU: cooler laptop, longer battery, and
# 4K that does not drop frames.
#
# This needs a VA-API driver behind mpv, and archsetup.py already installs one
# with the GPU choice - intel-media-driver and libva-utils for Intel, mesa's
# for AMD - so it is there before this file is ever read.
#
# auto-safe rather than a named backend: it only picks a decoder mpv considers
# safe for the format, and falls back to software instead of failing when
# there is none. That fallback is also why this is harmless on a machine with
# no working VA-API - it degrades to what the line above used to do.
#
# Check which one you actually got:
#   mpv --hwdec=auto-safe -v FILE 2>&1 | grep -i "Using .* decoding"
# On this laptop that prints "Using hardware decoding (vaapi)". Note that a
# synthetic clip (av://lavfi:testsrc) always says software - raw video has no
# hardware decoder - so test with a real H.264 or HEVC file.
hwdec=auto-safe

# --- behaviour --------------------------------------------------------------
keep-open=yes                  # do not close the window at end of file
save-position-on-quit=yes
screenshot-directory=~/Pictures/mpv
