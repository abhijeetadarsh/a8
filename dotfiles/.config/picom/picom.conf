# picom - compositor. i3 starts it via exec_always.
#
# Written against picom v13. Two options that used to live here,
# `glx-no-stencil` and `glx-copy-from-front`, were removed upstream: the first
# only produced a deprecation warning on every start, the second was silently
# ignored. Both are gone rather than commented out.

backend = "glx";

# --- opacity ----------------------------------------------------------------
# These were previously set twice in this file, and the second pair silently
# won - which is why unfocused windows were translucent despite the block at
# the top saying otherwise. One definition each now.
active-opacity = 1;
inactive-opacity = 0.95;
frame-opacity = 1;
inactive-opacity-override = false;

# The bar and notifications should never be dimmed by the rule above.
opacity-rule = [
    "100:class_g = 'Polybar'",
    "100:class_g = 'Dunst'",
    "100:fullscreen"
];

# --- fading -----------------------------------------------------------------
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
no-fading-openclose = false;
fade-exclude = [ ];

# --- tearing ----------------------------------------------------------------
vsync = true;
xrender-sync-fence = true;

# --- shadows ----------------------------------------------------------------
# Off: with i3's 2px borders drawn in the accent colour, shadows just muddy the
# edge between adjacent tiles.
shadow = false;

# --- corners ----------------------------------------------------------------
# Matches the 8px radius used by the rofi theme.
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
];

# --- window types -----------------------------------------------------------
wintypes:
{
    dock          = { shadow = false; };
    dnd           = { shadow = false; };
    tooltip       = { fade = true; shadow = false; focus = true; };
    popup_menu    = { opacity = 1; };
    dropdown_menu = { opacity = 1; };
};
