# picom - compositor. i3 starts it via exec_always.
#
# Written against picom v13. Two options that used to live here,
# `glx-no-stencil` and `glx-copy-from-front`, were removed upstream: the first
# only produced a deprecation warning on every start, the second was silently
# ignored. Both are gone rather than commented out.

backend = "glx";

# --- opacity ----------------------------------------------------------------
# These were previously set twice in this file, and the second pair silently
# won - which is why unfocused windows were translucent despite the block at
# the top saying otherwise. One definition each now.
active-opacity = 1;
inactive-opacity = 0.95;
frame-opacity = 1;
inactive-opacity-override = false;

# The bar and notifications should never be dimmed by the rule above.
opacity-rule = [
    "100:class_g = 'Polybar'",
    "100:class_g = 'Dunst'",
    "100:fullscreen"
];

# --- fading -----------------------------------------------------------------
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
no-fading-openclose = false;
fade-exclude = [ ];

# --- tearing ----------------------------------------------------------------
# This compositor is the *only* vsync in the stack. The display is driven by
# Xorg's `modesetting` driver, and that driver has no TearFree option - the
# string is not even in modesetting_drv.so, so an xorg.conf.d snippet setting
# it would be silently ignored. Nothing below picom is going to sync anything.
#
# Check it is actually taking effect after a change with:
#   picom --config ~/.config/picom/picom.conf --log-level=info --log-file=/tmp/picom.log
# A working setup logs "Using vblank scheduler: present." and lists the
# SGI_swap_control / OML_sync_control GLX extensions as present.
vsync = true;

# Only relevant on nvidia+glx, where clients' draw calls can otherwise land
# mid-frame. Harmless on the Intel path, and this machine has an MX330 that
# could end up driving things later.
xrender-sync-fence = true;

# The one path that survives `vsync = true` and tears anyway.
#
# When picom unredirects a window it stops compositing it and the app scans
# out straight to the screen, unsynced - so a fullscreen video or game tears
# no matter what vsync says. It is off by default, but "the default happens to
# be right" is not the same as saying so: this is exactly the setting someone
# turns on later for a few fps and then spends an evening wondering why only
# fullscreen tears. Leave it false and let picom sync every frame.
unredir-if-possible = false;

# --- shadows ----------------------------------------------------------------
# Off: with i3's 2px borders drawn in the accent colour, shadows just muddy the
# edge between adjacent tiles.
shadow = false;

# --- corners ----------------------------------------------------------------
# Matches the 8px radius used by the rofi theme.
corner-radius = 8;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'"
];

# --- window types -----------------------------------------------------------
wintypes:
{
    dock          = { shadow = false; };
    dnd           = { shadow = false; };
    tooltip       = { fade = true; shadow = false; focus = true; };
    popup_menu    = { opacity = 1; };
    dropdown_menu = { opacity = 1; };
};
